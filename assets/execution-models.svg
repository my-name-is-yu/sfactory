<svg xmlns="http://www.w3.org/2000/svg" width="800" height="304" viewBox="0 0 800 304" role="img" aria-labelledby="title desc">
  <title id="title">4つの実行方式</title>
  <desc id="desc">通常の Agent は LLM とツールを交互に使う。Skills は手順書を読む。Code Mode はタスク用のコードを生成する。SFactory は保存済み Workflow を実行し、判断点の較正データを蓄積する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#66738a" stroke-width="1.4"/>
    </marker>
    <marker id="feedback" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1l5 3-5 3" fill="none" stroke="#7241c7" stroke-width="1.4"/>
    </marker>
    <rect id="llm" width="98" height="42" rx="9" fill="#e8ecf2" stroke="#65748b"/>
    <rect id="tool" width="98" height="42" rx="9" fill="#f1f3f7" stroke="#8492a8"/>
    <rect id="code" width="98" height="42" rx="9" fill="#dcf2ee" stroke="#087f73"/>
    <rect id="memory" width="98" height="42" rx="9" fill="#eee6fb" stroke="#7241c7"/>
    <rect id="decision" width="127" height="42" rx="9" fill="#fbeadb" stroke="#ac590b"/>
    <path id="step" d="M0 21h21" fill="none" stroke="#66738a" stroke-width="1.5" marker-end="url(#arrow)"/>
  </defs>
  <rect x="1" y="1" width="798" height="302" rx="14" fill="#fff" stroke="#d8dfe8"/>
  <path d="M22 74h756M22 134h756M22 194h756" stroke="#e5e9ef"/>
  <g font-family="system-ui, sans-serif" font-size="16" fill="#182034" dominant-baseline="central">
    <g transform="translate(0 23)">
      <text x="23" y="21" font-weight="700">通常の Agent</text>
      <use href="#llm" x="160"/><use href="#step" x="259"/>
      <use href="#tool" x="282"/><use href="#step" x="381"/>
      <use href="#llm" x="404"/><use href="#step" x="503"/>
      <use href="#tool" x="526"/><use href="#step" x="625"/>
      <use href="#llm" x="648"/>
      <g text-anchor="middle"><text x="209" y="21">LLM</text><text x="331" y="21">ツール</text><text x="453" y="21">LLM</text><text x="575" y="21">ツール</text><text x="697" y="21">LLM</text></g>
    </g>
    <g transform="translate(0 83)">
      <text x="23" y="21" font-weight="700">Skills</text>
      <use href="#llm" x="160"/><use href="#step" x="259"/>
      <use href="#memory" x="282"/><use href="#step" x="381"/>
      <use href="#llm" x="404"/><use href="#step" x="503"/>
      <use href="#tool" x="526"/>
      <g text-anchor="middle"><text x="209" y="21">LLM</text><text x="331" y="21">手順書</text><text x="453" y="21">LLM</text><text x="575" y="21">ツール</text></g>
    </g>
    <g transform="translate(0 143)">
      <text x="23" y="21" font-weight="700">Code Mode</text>
      <use href="#llm" x="160"/><use href="#step" x="259"/>
      <use href="#code" x="282"/><use href="#step" x="381"/>
      <use href="#tool" x="404"/>
      <g text-anchor="middle"><text x="209" y="21">LLM</text><text x="331" y="21">コード生成</text><text x="453" y="21">ツール群</text></g>
    </g>
    <g transform="translate(0 203)">
      <text x="23" y="21" font-weight="700">SFactory</text>
      <use href="#llm" x="160"/><use href="#step" x="259"/>
      <use href="#memory" x="282"/><use href="#step" x="381"/>
      <use href="#code" x="404"/><use href="#step" x="503"/>
      <use href="#decision" x="526"/><use href="#step" x="654"/>
      <use href="#tool" x="677"/>
      <g text-anchor="middle"><text x="209" y="21">LLM</text><text x="331" y="21">Workflow</text><text x="453" y="21">コード実行</text><text x="589.5" y="14" font-size="13">Decision Model</text><text x="589.5" y="29" font-size="13">または LLM</text><text x="726" y="21">ツール</text></g>
      <path d="M589.5 43v20H331V44" fill="none" stroke="#7241c7" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#feedback)"/>
      <text x="471" y="80" text-anchor="middle" fill="#6435b2" font-size="14">判断点ごとの較正データを蓄積</text>
    </g>
  </g>
</svg>
